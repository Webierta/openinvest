name: CI (Analyze & Test)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Análisis y Pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar y Configurar Flutter (3.47.2)
        run: |
          git clone https://github.com/flutter/flutter.git -b 3.47.2 --depth 1 _flutter
          echo "$GITHUB_WORKSPACE/_flutter/bin" >> $GITHUB_PATH
          export PATH="$GITHUB_WORKSPACE/_flutter/bin:$PATH"
          flutter precache
          flutter doctor -v

      - name: Instalar dependencias
        run: flutter pub get

      - name: Análisis estático (Flutter Analyze)
        run: flutter analyze

      - name: Ejecutar Tests
        run: flutter test
