name: CD (Build & Release)

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    name: Compilar y Publicar (Android & Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter y Android SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          android-sdk: true

      # --- DEPENDENCIAS PARA LINUX ---
      - name: Instalar dependencias de Linux Desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Habilitar soporte de Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      # --- COMPILACIÓN ANDROID ---
      - name: Compilar APKs Android (Release por arquitectura)
        run: flutter build apk --release --split-per-abi

      # --- COMPILACIÓN LINX ---
      - name: Compilar Linux (Release)
        run: flutter build linux --release

      - name: Empaquetar binario de Linux
        run: tar -czvf openinvest-linux-x86_64.tar.gz -C build/linux/x64/release/bundle .

      # --- PUBLICACIÓN EN GITHUB RELEASES ---
      - name: Adjuntar archivos al Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
            openinvest-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
