name: CD (Build & Release)

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: cd-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Compilar y Publicar (Android & Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Configurar Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar entorno Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Instalar dependencias de Linux Desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y             clang             cmake             ninja-build             pkg-config             libgtk-3-dev             liblzma-dev

      - name: Habilitar soporte de Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Analizar proyecto
        run: flutter analyze

      - name: Compilar APKs Android (Release por arquitectura)
        run: flutter build apk --release --split-per-abi

      - name: Mostrar APKs generados
        run: |
          echo "APK generados:"
          ls -lh build/app/outputs/flutter-apk/

      - name: Compilar Linux (Release)
        run: flutter build linux --release

      - name: Empaquetar binario de Linux
        run: |
          tar -czvf openinvest-linux-x86_64.tar.gz             -C build/linux/x64/release/bundle .

      - name: Mostrar paquete Linux
        run: |
          echo "Paquete Linux generado:"
          ls -lh openinvest-linux-x86_64.tar.gz

      - name: Adjuntar archivos al Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            openinvest-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
