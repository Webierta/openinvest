name: CD (Build & Release)

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: cd-release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build-release:
    name: Compilar y Publicar (Android & Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v5

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Configurar Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar entorno Flutter
        run: |
          flutter --version
          flutter doctor -v

      - name: Crear keystore temporal desde Secret
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/openinvest-release.keystore"

      - name: Crear configuración temporal de firma
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/openinvest-release.keystore
          EOF

      - name: Configurar Gradle temporalmente para firmar Release
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")
          text = path.read_text()

          marker = 'android {'
          if marker not in text:
              raise SystemExit("ERROR: No se encontró el bloque android.")

          import_block = '''import java.util.Properties
          import java.io.FileInputStream

          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")

          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          '''

          text = import_block + text

          signing_block = '''
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties.getProperty("keyAlias")
                      keyPassword = keystoreProperties.getProperty("keyPassword")
                      storeFile = keystoreProperties.getProperty("storeFile")?.let { file(it) }
                      storePassword = keystoreProperties.getProperty("storePassword")
                  }
              }

          '''

          if 'signingConfigs {' in text:
              raise SystemExit(
                  "ERROR: Ya existe un bloque signingConfigs. "
                  "No se modifica automáticamente."
              )

          text = text.replace(
              '    buildTypes {',
              signing_block + '    buildTypes {',
              1
          )

          old_signing = 'signingConfig = signingConfigs.getByName("debug")'
          new_signing = 'signingConfig = signingConfigs.getByName("release")'

          if old_signing not in text:
              raise SystemExit(
                  'ERROR: No se encontró la configuración de firma debug esperada.'
              )

          text = text.replace(old_signing, new_signing, 1)

          path.write_text(text)
          PY

      - name: Instalar dependencias de Linux Desktop
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev \
            libsecret-1-dev

      - name: Habilitar soporte de Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Instalar dependencias del proyecto
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze

      - name: Compilar APKs Android (Release por arquitectura)
        run: flutter build apk --release --split-per-abi

      - name: Verificar APKs generados
        run: |
          echo "APK generados:"
          ls -lh build/app/outputs/flutter-apk/

          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          test -s build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          test -s build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Verificar certificados de los APKs
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"

          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          do
            echo
            echo "=============================================="
            echo "Certificado de: $APK"
            echo "=============================================="

            "$APKSIGNER" verify \
              --print-certs \
              "$APK"
          done

      - name: Verificar SHA-256 de los certificados de los APKs
        run: |
          EXPECTED="AE:BA:3E:F9:A2:66:99:66:18:86:C5:F4:1D:F5:24:14:8E:F5:51:E1:BB:6F:76:1D:6D:38:24:FF:3E:7F:53:DD"

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"

          for APK in \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          do
            echo
            echo "=============================================="
            echo "Verificando SHA-256:"
            echo "$APK"
            echo "=============================================="

            ACTUAL=$(
              "$APKSIGNER" verify \
                --print-certs \
                "$APK" |
              sed -n 's/.*certificate SHA-256 digest: //p' |
              head -n 1 |
              tr '[:lower:]' '[:upper:]'
            )

            ACTUAL=$(echo "$ACTUAL" | sed 's/../&:/g; s/:$//')

            echo "SHA-256 esperado: $EXPECTED"
            echo "SHA-256 obtenido: $ACTUAL"

            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "ERROR: El APK NO está firmado con la clave esperada."
              exit 1
            fi

            echo "OK: $APK está firmado con la clave esperada."
          done

      - name: Compilar Linux (Release)
        run: flutter build linux --release

      - name: Empaquetar binario de Linux
        run: |
          tar -czvf openinvest-linux-x86_64.tar.gz \
            -C build/linux/x64/release/bundle .

      - name: Verificar paquete Linux
        run: |
          echo "Paquete Linux generado:"
          ls -lh openinvest-linux-x86_64.tar.gz
          test -s openinvest-linux-x86_64.tar.gz

      - name: Adjuntar archivos al Release de GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            openinvest-linux-x86_64.tar.gz
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Eliminar material temporal de firma
        if: always()
        run: |
          rm -f android/key.properties
          rm -f "$RUNNER_TEMP/openinvest-release.keystore"
