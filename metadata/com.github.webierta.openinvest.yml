AntiFeatures:
  NonFreeNet:
    en-US: Fund search and market data depend on third-party services including Financial Times, Morningstar and Yahoo Finance.
Categories:
  - Money
License: GPL-3.0-or-later
AuthorName: Webierta
WebSite: https://github.com/Webierta/openinvest
SourceCode: https://github.com/Webierta/openinvest
IssueTracker: https://github.com/Webierta/openinvest/issues

Summary: Open-source investment fund portfolio manager
Description: |-
  OpenInvest is a clean, open-source application for managing and tracking investment fund portfolios on Android and Linux.

  Features:
  * Fund search and real-time data using ISIN codes and public sources (CNMV, ECB/IFS, Morningstar, Yahoo Finance).
  * Advanced financial performance metrics (TAE, TWR, MWR/TIR).
  * Cost and fee audits (TER and performance fees).
  * Interactive evolution charts and monthly heatmaps.
  * Benchmark comparisons against major global indices.
  * Side-by-side fund comparison tool.
  * Professional annual PDF report generation and CSV operations export.
  * Full portfolio backup and restore with smart merge.
  * 100% private, local storage with biometric/password security.

# Configuración de compilación para F-Droid
Builds:
  - versionName: 2.0.10
    versionCode: 1069
    commit: 536292fdb56793028465c20c6b937a8e0d3cb981
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang cmake ninja-build pkg-config
    srclibs:
      - flutter@3.50.0
    prebuild:
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    build:
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

