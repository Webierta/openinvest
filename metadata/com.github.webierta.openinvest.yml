Summary: Open-source investment fund portfolio manager

# Configuración de compilación para F-Droid
Builds:
  - versionName: 2.0.10
    versionCode: 1069
    commit: 023bc3427d7d9c2a98076631b46f15ee52d8a4b4
    sudo:
      - apt-get update
      - apt-get install -y build-essential clang cmake ninja-build pkg-config
    srclibs:
      - flutter@3.50.0
    prebuild:
      - >-
        flutterVersion=$(sed -n -E "s/.*flutter-version: '(.*)'/\1/p" .github/workflows/cd.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - $$flutter$$/bin/flutter config --no-analytics --no-cli-animations
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    build: $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

  - versionName: 2.0.10
