Summary: Open-source investment fund portfolio manager
Description: |-
  OpenInvest is a clean, open-source application for managing and tracking investment fund portfolios on Android and Linux.

  Features:
  * Fund search and real-time data using ISIN codes (CNMV, Morningstar, Yahoo Finance).
  * Advanced financial performance metrics (TAE, TWR, MWR/TIR).
  * Cost and fee audits (TER and performance fees).
  * Interactive evolution charts and monthly heatmaps.
  * Benchmark comparisons against major global indices.
  * Side-by-side fund comparison tool.
  * Professional annual PDF report generation and CSV operations export.
  * Full portfolio backup and restore with smart merge.
  * 100% private, local storage with biometric/password security.

